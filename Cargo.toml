[package]
name = "alice-game-engine"
version = "0.6.0"
edition = "2021"
license = "MIT OR LicenseRef-Commercial"
description = "Hybrid mesh+SDF game engine — ECS, deferred renderer, spatial audio, UI, particles, navmesh"
repository = "https://github.com/ext-sakamoro/ALICE-GameEngine"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
keywords = ["game-engine", "sdf", "ecs", "renderer", "audio"]
categories = ["game-engines", "graphics", "rendering"]

[features]
default = []
gpu = ["wgpu", "pollster", "bytemuck"]
window = ["winit", "gpu"]
sdf = []
audio = []
ui = []
particles = []
navmesh = []
ffi = []
python = ["ffi"]
godot = ["ffi"]
audio_output = ["audio", "cpal"]
network_udp = ["tokio"]
full = ["window", "sdf", "audio", "ui", "particles", "navmesh"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rayon = "1.10"
wide = "0.7"

# GPU renderer (optional)
wgpu = { version = "25", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }

# Audio output device (optional, requires `audio_output` feature).
cpal = { version = "0.16", optional = true }

# Async UDP transport (optional, requires `network_udp` feature).
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync"], optional = true }

# Window (optional)
winit = { version = "0.30", optional = true }

[dev-dependencies]
approx = "0.5"
naga = { version = "25", default-features = false, features = ["wgsl-in"] }

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

[[example]]
name = "hello_engine"
required-features = ["full"]

[[example]]
name = "spinning_cube"
required-features = ["full"]

[[example]]
name = "pong"
required-features = ["full"]

[[example]]
name = "physics_sandbox"
required-features = ["full"]

[[example]]
name = "npc_chat"

[[example]]
name = "mcp_controlled"

[[example]]
name = "rpg"
path = "templates/rpg.rs"

[[example]]
name = "multiplayer_battle"
path = "templates/multiplayer_battle.rs"

[[example]]
name = "visual_novel"
path = "templates/visual_novel.rs"

[[example]]
name = "platformer_action"
path = "templates/platformer_action.rs"
required-features = ["particles"]

[[example]]
name = "fps_combat"
path = "templates/fps_combat.rs"

[[example]]
name = "decal_demo"
path = "templates/decal_demo.rs"

[[example]]
name = "job_system_demo"
path = "templates/job_system_demo.rs"

[[example]]
name = "constraint_demo"
path = "templates/constraint_demo.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1
