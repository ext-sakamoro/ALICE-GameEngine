name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (default features)
        run: cargo clippy -- -W clippy::all
      - name: Clippy (full features)
        run: cargo clippy --features full -- -W clippy::all
      # the VRM fixture is the bytes scripts/vrm_fixture.py writes from the specifications
      - name: VRM fixture (independent writer)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/vrm_fixture.py --check
          "$PY" scripts/call_fx_reference.py --check
      - name: Test (default features)
        run: cargo test
      - name: Test (full features)
        run: cargo test --features full
      - name: Doc check (RUSTDOCFLAGS=-Dwarnings)
        run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: Doc-tests
        run: cargo test --doc --features full

  physics:
    name: physics feature (ALICE-Physics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (physics)
        run: cargo clippy --features physics -- -W clippy::all
      - name: Test (physics)
        run: |
          set -o pipefail
          cargo test --features physics 2>&1 | python3 scripts/min_passed.py lib=1044 physics_hub_analytic=23 physics_hub_degenerate=10

  each-feature:
    name: each feature builds on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # audio_output (cpal) links ALSA on Linux
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # every feature of Cargo.toml (scripts/each_feature.py reads the table) with
      # --no-default-features; a failed check or nothing checked fails the step
      - name: cargo check --lib for each feature alone
        run: python3 scripts/each_feature.py

  gpu-oracle:
    name: GPU oracles on a software adapter (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # lavapipe (Mesa's software Vulkan) is the adapter wgpu picks on a runner without a GPU;
      # the GPU tests request an adapter with expect(), so a missing one fails, never skips
      - name: Install Mesa Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # the #[ignore = "needs a working GPU adapter"] tests run here; min_passed fails when a
      # binary ran fewer tests than named (hd2d_postfx 15 in the library, vrm_render 4)
      - name: GPU tests (--include-ignored)
        run: |
          set -o pipefail
          cargo test --features gpu --lib hd2d_postfx -- --include-ignored 2>&1 | python3 scripts/min_passed.py lib=15
          cargo test --features gpu --test vrm_render -- --include-ignored 2>&1 | python3 scripts/min_passed.py vrm_render=4

  mobile-build:
    name: mobile build smoke (iOS + Android cargo check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-linux-android
      # `rust-toolchain.toml` pins channel 1.92.0 and `dtolnay/rust-toolchain@stable`
      # honours that pin (silently ignoring `targets:`), so add the mobile targets
      # explicitly to the pinned toolchain.
      - name: Install mobile targets on pinned toolchain
        run: rustup target add aarch64-apple-ios aarch64-linux-android
      - name: cargo check (iOS aarch64)
        run: cargo check --target aarch64-apple-ios --no-default-features
      - name: cargo check (Android aarch64)
        run: cargo check --target aarch64-linux-android --no-default-features

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
