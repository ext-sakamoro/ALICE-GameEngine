name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (default features)
        run: cargo clippy -- -W clippy::all
      - name: Clippy (full features)
        run: cargo clippy --features full -- -W clippy::all
      - name: Test (default features)
        run: cargo test
      - name: Test (full features)
        run: cargo test --features full
      - name: Doc check (RUSTDOCFLAGS=-Dwarnings)
        run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: Doc-tests
        run: cargo test --doc --features full

  mobile-build:
    name: mobile build smoke (iOS + Android cargo check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-linux-android
      - name: cargo check (iOS aarch64)
        run: cargo check --target aarch64-apple-ios --no-default-features
      - name: cargo check (Android aarch64)
        run: cargo check --target aarch64-linux-android --no-default-features

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
